  <style>
    /* Embedded Offline Fonts */
    @font-face {
      font-family: 'Vazirmatn';
      src: url('/fonts/Vazirmatn-UI-NL-Regular.ttf') format('truetype');
      font-weight: 300 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Vazirmatn';
      src: url('/fonts/Vazirmatn-UI-NL-SemiBold.ttf') format('truetype');
      font-weight: 600 700 800;
      font-style: normal;
      font-display: swap;
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      /* Typography font stack: text & Persian fonts first, emoji fonts at the very end to prevent wide whitespace glitch */
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans Arabic", "Inter", "Helvetica Neue", Arial, sans-serif,
        "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg);
      color: var(--text);
    }

    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* Mobile Input & Caret Fixes (Prevents auto-zoom & caret jumps) */
    @media screen and (max-width: 768px) {
      input[type="text"],
      input[type="search"],
      input[type="password"],
      input[type="email"],
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    input, textarea {
      unicode-bidi: normal !important;
      -webkit-user-select: text;
      user-select: text;
    }

    /* BiDi / RTL text helpers */
    .bidi-text {
      unicode-bidi: plaintext;
      text-align: start;
    }
    .bidi-isolate {
      unicode-bidi: isolate;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.25);
      border-radius: 999px;
    }

    /* Hide scrollbar utility for horizontal tabs & strips */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /* Toast Animations */
    @keyframes toastSlideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }
    @keyframes toastCountdown {
      from {
        width: 100%;
      }
      to {
        width: 0%;
      }
    }
